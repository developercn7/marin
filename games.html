<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الألعاب | مارين مجدي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0a0c1e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
a.home{color:#9d8cff;text-decoration:none;margin-bottom:16px}
h1{margin-bottom:8px}
.tabs{display:flex;gap:10px;margin:16px 0}
.tabs button{background:#1b1e3a;color:#fff;border:1px solid #444;padding:10px 22px;border-radius:24px;font-size:16px;cursor:pointer}
.tabs button.active{background:#6c4df6;border-color:#6c4df6}
.game{display:none;width:100%;max-width:420px;text-align:center}
.game.active{display:block}
canvas{background:#11142e;border-radius:12px;max-width:100%;touch-action:none}
#board{display:grid;grid-template-columns:repeat(3,110px);gap:8px;justify-content:center;margin:16px auto}
.cell{width:110px;height:110px;background:#1b1e3a;border-radius:12px;font-size:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.cell.win{background:#2e7d32}
#status,#snakeScore{margin:12px;font-size:18px;min-height:24px}
.again{background:#6c4df6;color:#fff;border:0;padding:10px 26px;border-radius:24px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<a class="home" href="index.html">← رجوع للموقع</a>
<h1>الألعاب 🎮</h1>
<div class="tabs">
<button id="tabXo" class="active" type="button">إكس أو</button>
<button id="tabSnake" type="button">التعبان</button>
</div>

<div class="game active" id="gameXo">
<div id="board"></div>
<div id="status">دورك يا بطل، إنت X</div>
<button class="again" id="xoAgain" type="button">من الأول</button>
</div>

<div class="game" id="gameSnake">
<canvas id="snake" width="360" height="360"></canvas>
<div id="snakeScore">النقاط: 0</div>
<button class="again" id="snakeAgain" type="button">من الأول</button>
<p style="opacity:.7;font-size:14px">على الموبايل: اسحب بصباعك على اللعبة. على الكمبيوتر: الأسهم</p>
</div>

<script>
var tabXo=document.getElementById('tabXo'),tabSnake=document.getElementById('tabSnake');
var gameXo=document.getElementById('gameXo'),gameSnake=document.getElementById('gameSnake');
tabXo.onclick=function(){tabXo.classList.add('active');tabSnake.classList.remove('active');gameXo.classList.add('active');gameSnake.classList.remove('active');};
tabSnake.onclick=function(){tabSnake.classList.add('active');tabXo.classList.remove('active');gameSnake.classList.add('active');gameXo.classList.remove('active');};

/* XO */
var board=document.getElementById('board'),statusEl=document.getElementById('status');
var cells=[],state=[],over=false;
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function xoInit(){board.innerHTML='';cells=[];state=Array(9).fill('');over=false;statusEl.textContent='دورك يا بطل، إنت X';
for(var i=0;i<9;i++){var c=document.createElement('div');c.className='cell';c.dataset.i=i;c.onclick=human;board.appendChild(c);cells.push(c);}}
function winner(s){for(var j=0;j<LINES.length;j++){var l=LINES[j];if(s[l[0]]&&s[l[0]]===s[l[1]]&&s[l[1]]===s[l[2]])return l;}return null;}
function human(){var i=+this.dataset.i;if(over||state[i])return;state[i]='X';cells[i].textContent='X';
var w=winner(state);if(w){end('كسبت! 🎉',w);return;}
if(state.indexOf('')===-1){end('تعادل 🤝',null);return;}
statusEl.textContent='الكمبيوتر بيفكر...';setTimeout(cpu,400);}
function cpu(){var move=findMove('O');if(move===-1)move=findMove('X');
if(move===-1&&state[4]==='')move=4;
if(move===-1){var open=[];for(var i=0;i<9;i++)if(!state[i])open.push(i);move=open[Math.floor(Math.random()*open.length)];}
state[move]='O';cells[move].textContent='O';
var w=winner(state);if(w){end('الكمبيوتر كسب 😅',w);return;}
if(state.indexOf('')===-1){end('تعادل 🤝',null);return;}
statusEl.textContent='دورك';}
function findMove(p){for(var j=0;j<LINES.length;j++){var l=LINES[j];var vals=[state[l[0]],state[l[1]],state[l[2]]];
if(vals.filter(function(v){return v===p;}).length===2&&vals.indexOf('')!==-1)return l[vals.indexOf('')];}return -1;}
function end(msg,line){over=true;statusEl.textContent=msg;if(line)line.forEach(function(i){cells[i].classList.add('win');});}
document.getElementById('xoAgain').onclick=xoInit;
xoInit();

/* Snake */
var cv=document.getElementById('snake'),ctx=cv.getContext('2d');
var N=18,S=20,snake,dir,food,score,loop;
function snakeInit(){snake=[{x:9,y:9}];dir={x:1,y:0};score=0;placeFood();
document.getElementById('snakeScore').textContent='النقاط: 0';
if(loop)clearInterval(loop);loop=setInterval(tick,140);}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}while(snake.some(function(p){return p.x===food.x&&p.y===food.y;}));}
function tick(){var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(p){return p.x===h.x&&p.y===h.y;})){clearInterval(loop);
ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#fff';ctx.font='24px Tahoma';ctx.textAlign='center';
ctx.fillText('خسرت 😅 النقاط: '+score,cv.width/2,cv.height/2);return;}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;document.getElementById('snakeScore').textContent='النقاط: '+score;placeFood();}else snake.pop();
ctx.fillStyle='#11142e';ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#e74c3c';ctx.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
ctx.fillStyle='#6c4df6';snake.forEach(function(p,i){ctx.fillStyle=i===0?'#9d8cff':'#6c4df6';ctx.fillRect(p.x*S+1,p.y*S+1,S-2,S-2);});}
function setDir(x,y){if(snake.length>1&&snake[0].x+x===snake[1].x&&snake[0].y+y===snake[1].y)return;dir={x:x,y:y};}
document.addEventListener('keydown',function(e){
if(e.key==='ArrowUp')setDir(0,-1);else if(e.key==='ArrowDown')setDir(0,1);
else if(e.key==='ArrowLeft')setDir(-1,0);else if(e.key==='ArrowRight')setDir(1,0);});
var tx=0,ty=0;
cv.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchmove',function(e){e.preventDefault();var dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:false});
document.getElementById('snakeAgain').onclick=snakeInit;
snakeInit();
</script>
</body>
</html>
